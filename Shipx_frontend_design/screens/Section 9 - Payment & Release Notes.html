<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shipx · Section 9 — Payment &amp; Release Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Kumbh+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; font-family: "Kumbh Sans", system-ui, sans-serif; }
  *, *::before, *::after { box-sizing: border-box; }
  #root { height: 100vh; }
  input::placeholder, textarea::placeholder { color: #9aa0a6; }
  button { font-family: inherit; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="browser-window.jsx"></script>
<script type="text/babel" src="shared/components.jsx"></script>
<script type="text/babel" src="shared/app-shell.jsx"></script>
<script type="text/babel" src="platform/platform-screens.jsx"></script>
<script type="text/babel" src="tenant/tenant-admin-screens.jsx"></script>
<script type="text/babel" src="china/china-screens.jsx"></script>
<script type="text/babel" src="nigeria/nigeria-screens.jsx"></script>
<script type="text/babel" src="nigeria/billing-screens.jsx"></script>
<script type="text/babel" src="nigeria/release-notes-screens.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const Frame = ({url, w = 1440, h = 900, children}) => (
  <ChromeWindow tabs={[{title: 'Shipx · ' + url.split('/').slice(-1)[0]}]} activeIndex={0} url={url} width={w} height={h}>
    <div style={{width: w, height: h - 84, background: '#fff', position: 'relative', overflow: 'hidden'}}>{children}</div>
  </ChromeWindow>
);

const App = () => (
  <DesignCanvas>
    <DCSection id="list" title="9.1 — Release Notes List" subtitle="Authorization documents for warehouse pickup. Statuses: Active · Picked up · Partial · Expired · Cancelled. Inline pickup recording for active rows.">
      <DCArtboard id="rn-list" label="Release notes list" width={1600} height={1100}>
        <Frame url="shipx.co/release-notes" w={1600} h={1100}><ReleaseNotesList /></Frame>
      </DCArtboard>
    </DCSection>

    <DCSection id="detail" title="9.2 — Release Note Detail" subtitle="Two states + 2 modals. Side-by-side: printable A4 release note (left) + pickup window/customer/payment cards (right). Designed for one-look operator scanning.">
      <DCArtboard id="rn-active" label="Active · awaiting pickup" width={1600} height={1500}>
        <Frame url="shipx.co/release-notes/RN-20260728-ABC123" w={1600} h={1500}><ReleaseNoteDetail state="active" /></Frame>
      </DCArtboard>
      <DCArtboard id="rn-picked-up" label="Picked up · delegate collection" width={1600} height={1500}>
        <Frame url="shipx.co/release-notes/RN-20260728-ABC123" w={1600} h={1500}><ReleaseNoteDetail state="picked_up" /></Frame>
      </DCArtboard>
      <DCArtboard id="rn-split-modal" label="Split release modal · 2 of 4 selected" width={1600} height={1500}>
        <Frame url="shipx.co/release-notes/RN-20260728-ABC123" w={1600} h={1500}><ReleaseNoteDetail state="active" withModal="split" /></Frame>
      </DCArtboard>
      <DCArtboard id="rn-pickup-modal" label="Record pickup modal · delegate" width={1600} height={1500}>
        <Frame url="shipx.co/release-notes/RN-20260728-ABC123" w={1600} h={1500}><ReleaseNoteDetail state="active" withModal="pickup" /></Frame>
      </DCArtboard>
    </DCSection>

    <DCSection id="warehouse" title="9.3 — Warehouse Attendant View" subtitle="Stripped-down portal for the warehouse role. Big scanner card · priority-coded queue · one-tap record-pickup flow. Amber 'WAREHOUSE' role badge.">
      <DCArtboard id="warehouse-queue" label="Pickup queue · home" width={1600} height={1180}>
        <Frame url="shipx.co/warehouse" w={1600} h={1180}><WarehouseView /></Frame>
      </DCArtboard>
      <DCArtboard id="warehouse-pickup" label="Recording a pickup (modal open)" width={1600} height={1180}>
        <Frame url="shipx.co/warehouse" w={1600} h={1180}><WarehouseView withModal /></Frame>
      </DCArtboard>
    </DCSection>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
