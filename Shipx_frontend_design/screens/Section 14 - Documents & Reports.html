<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shipx · Section 14 — Documents &amp; Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Kumbh+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; font-family: "Kumbh Sans", system-ui, sans-serif; }
  *, *::before, *::after { box-sizing: border-box; }
  #root { height: 100vh; }
  input::placeholder, textarea::placeholder { color: #9aa0a6; }
  button { font-family: inherit; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="browser-window.jsx"></script>
<script type="text/babel" src="shared/components.jsx"></script>
<script type="text/babel" src="shared/app-shell.jsx"></script>
<script type="text/babel" src="reports/reports-screens.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const Frame = ({url, w = 1440, h = 900, children}) => (
  <ChromeWindow tabs={[{title: 'Shipx · ' + url.split('/').slice(-1)[0]}]} activeIndex={0} url={url} width={w} height={h}>
    <div style={{width: w, height: h - 84, background: '#fff', position: 'relative', overflow: 'hidden'}}>{children}</div>
  </ChromeWindow>
);

const App = () => (
  <DesignCanvas>
    <DCSection id="import" title="14.3 — Bulk Import (China Office)" subtitle="3-step wizard to create packing lists from an Excel upload. Upload → validate (with row-level errors) → confirm. Lives in the China Office portal.">
      <DCArtboard id="import-1" label="Step 1 · Upload file" width={1280} height={1080}>
        <Frame url="shipx.co/packing-lists/import" w={1280} h={1080}><BulkImport step={1} /></Frame>
      </DCArtboard>
      <DCArtboard id="import-2" label="Step 2 · Review &amp; validate" width={1440} height={1180}>
        <Frame url="shipx.co/packing-lists/import" w={1440} h={1180}><BulkImport step={2} /></Frame>
      </DCArtboard>
      <DCArtboard id="import-3" label="Step 3 · Confirm import" width={1280} height={1000}>
        <Frame url="shipx.co/packing-lists/import" w={1280} h={1000}><BulkImport step={3} /></Frame>
      </DCArtboard>
      <DCArtboard id="import-4" label="Success" width={1280} height={760}>
        <Frame url="shipx.co/packing-lists/import" w={1280} h={760}><BulkImport step={4} /></Frame>
      </DCArtboard>
    </DCSection>

    <DCSection id="reports" title="14.10 — Tenant Reports &amp; Analytics" subtitle="Business KPIs for the Tenant Admin: operational stats, stacked container pipeline, revenue donut, top customers, CBM/billing table, claims summary.">
      <DCArtboard id="tenant-reports" label="Reports &amp; analytics" width={1600} height={1500}>
        <Frame url="shipx.co/admin/reports" w={1600} h={1500}><TenantReports /></Frame>
      </DCArtboard>
    </DCSection>

    <DCSection id="audit" title="14.7 — Platform Audit Log" subtitle="Cross-tenant audit trail with multi-filter bar, action badges, before→after diffs, and an expanded JSON-diff row.">
      <DCArtboard id="platform-audit" label="Platform audit log" width={1600} height={1080}>
        <Frame url="shipx.co/platform/audit-log" w={1600} h={1080}><PlatformAuditLog /></Frame>
      </DCArtboard>
    </DCSection>

    <DCSection id="notiflog" title="14.11 — Notification Delivery Log" subtitle="Which messages went to which customers, on which channel, and whether they delivered. Retry on failures, detail modal with gateway response.">
      <DCArtboard id="notif-log" label="Delivery log" width={1600} height={1080}>
        <Frame url="shipx.co/admin/notifications/log" w={1600} h={1080}><NotificationLog /></Frame>
      </DCArtboard>
      <DCArtboard id="notif-modal" label="Notification detail modal" width={1600} height={1080}>
        <Frame url="shipx.co/admin/notifications/log" w={1600} h={1080}><NotificationLog withModal /></Frame>
      </DCArtboard>
    </DCSection>

    <DCSection id="print" title="14.12 — Print / PDF Layouts (A4)" subtitle="Print-ready black-and-white documents at true A4 (794×1123px @ 96dpi). Packing list with APPROVED stamp; release note with QR + signature block.">
      <DCArtboard id="print-pl" label="Packing list · A4 print" width={874} height={1203}>
        <Frame url="shipx.co/packing-lists/PL-…/print" w={874} h={1203}><PrintPackingList /></Frame>
      </DCArtboard>
      <DCArtboard id="print-rn" label="Release note · A4 print" width={874} height={1203}>
        <Frame url="shipx.co/release-notes/RN-…/print" w={874} h={1203}><PrintReleaseNote /></Frame>
      </DCArtboard>
    </DCSection>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
