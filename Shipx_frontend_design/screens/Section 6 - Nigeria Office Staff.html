<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shipx · Section 6 — Nigeria Office Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Kumbh+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; font-family: "Kumbh Sans", system-ui, sans-serif; }
  *, *::before, *::after { box-sizing: border-box; }
  #root { height: 100vh; }
  input::placeholder, textarea::placeholder { color: #9aa0a6; }
  button { font-family: inherit; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="browser-window.jsx"></script>
<script type="text/babel" src="shared/components.jsx"></script>
<script type="text/babel" src="shared/app-shell.jsx"></script>
<script type="text/babel" src="platform/platform-screens.jsx"></script>
<script type="text/babel" src="tenant/tenant-admin-screens.jsx"></script>
<script type="text/babel" src="china/china-screens.jsx"></script>
<script type="text/babel" src="nigeria/nigeria-screens.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const Frame = ({url, w = 1440, h = 900, children}) => (
  <ChromeWindow tabs={[{title: 'Shipx · ' + url.split('/').slice(-1)[0]}]} activeIndex={0} url={url} width={w} height={h}>
    <div style={{width: w, height: h - 84, background: '#fff', position: 'relative'}}>{children}</div>
  </ChromeWindow>
);

const App = () => (
  <DesignCanvas>
    <DCSection id="dash" title="6.1 — Operations Dashboard" subtitle="Nigeria-side operator's home. Urgent actions panel · KPI stats · live container pipeline kanban · payments + incoming shipments side-by-side.">
      <DCArtboard id="ng-dashboard" label="Operations dashboard" width={1600} height={1480}>
        <Frame url="shipx.co/dashboard" w={1600} h={1480}><NgOpsDashboard /></Frame>
      </DCArtboard>
    </DCSection>

    <DCSection id="manifests" title="6.2 — Manifest List" subtitle="Awaiting-verification queue front and center. Overdue rows flagged. Inline Verify / Resolve actions per row.">
      <DCArtboard id="manifest-list" label="Manifest list" width={1440} height={1100}>
        <Frame url="shipx.co/manifests" h={1100}><ManifestList /></Frame>
      </DCArtboard>
    </DCSection>

    <DCSection id="manifest-detail" title="6.3 — Manifest Detail" subtitle="Three states: pending (verify CTA), discrepancy (with per-customer carton flags), verified (locked). Plus the Verify modal with logged discrepancies form.">
      <DCArtboard id="mf-pending" label="Manifest · Pending verification" width={1440} height={1100}>
        <Frame url="shipx.co/manifests/MF-20260728-001" h={1100}><ManifestDetail state="pending" /></Frame>
      </DCArtboard>
      <DCArtboard id="mf-discrepancy" label="Manifest · Discrepancy found" width={1440} height={1100}>
        <Frame url="shipx.co/manifests/MF-20260728-001" h={1100}><ManifestDetail state="discrepancy" /></Frame>
      </DCArtboard>
      <DCArtboard id="mf-verified" label="Manifest · Verified (locked)" width={1440} height={1100}>
        <Frame url="shipx.co/manifests/MF-20260728-001" h={1100}><ManifestDetail state="verified" /></Frame>
      </DCArtboard>
      <DCArtboard id="mf-verify-modal" label="Verify modal · with 2 discrepancies logged" width={1440} height={1100}>
        <Frame url="shipx.co/manifests/MF-20260728-001" h={1100}><ManifestDetail state="pending" withModal /></Frame>
      </DCArtboard>
    </DCSection>

    <DCSection id="status" title="6.4 — Update Container Status" subtitle="Two-step flow: stage picker (forward-only, sequential) → notification confirmation (preview SMS/WhatsApp/Email before triggering customer outreach).">
      <DCArtboard id="status-picker" label="Stage picker · Customs clearance selected" width={1440} height={1000}>
        <Frame url="shipx.co/containers/HLBU9384712/status" h={1000}><UpdateStatusModal state="pick" /></Frame>
      </DCArtboard>
      <DCArtboard id="status-confirm" label="Confirm notification · 8 customers" width={1440} height={1000}>
        <Frame url="shipx.co/containers/HLBU9384712/status" h={1000}><UpdateStatusModal state="confirm" /></Frame>
      </DCArtboard>
    </DCSection>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
