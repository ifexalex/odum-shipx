<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shipx · Section 3 — Tenant Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Kumbh+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; font-family: "Kumbh Sans", system-ui, sans-serif; }
  *, *::before, *::after { box-sizing: border-box; }
  #root { height: 100vh; }
  input::placeholder, textarea::placeholder { color: #9aa0a6; }
  button { font-family: inherit; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="browser-window.jsx"></script>
<script type="text/babel" src="shared/components.jsx"></script>
<script type="text/babel" src="shared/app-shell.jsx"></script>
<script type="text/babel" src="platform/platform-screens.jsx"></script>
<script type="text/babel" src="tenant/tenant-admin-screens.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const Frame = ({url, w = 1440, h = 900, children}) => (
  <ChromeWindow tabs={[{title: 'Shipx · ' + url.split('/').slice(-1)[0]}]} activeIndex={0} url={url} width={w} height={h}>
    <div style={{width: w, height: h - 84, background: '#fff', position: 'relative'}}>{children}</div>
  </ChromeWindow>
);

const App = () => (
  <DesignCanvas>
    <DCSection id="dash" title="3.1 — Tenant Admin Dashboard" subtitle="The shipping company's operational home. Greeting hero, stats, recent containers, activity feed, recent logins, quick actions.">
      <DCArtboard id="tenant-dash" label="Dashboard · Default" width={1440} height={1240}>
        <Frame url="shipx.co/admin/dashboard" h={1240}><TenantDashboard /></Frame>
      </DCArtboard>
    </DCSection>

    <DCSection id="staff" title="3.2 + 3.3 — Staff Users + Invite Modal" subtitle="Role filter chips · 10 staff with mixed statuses · Invite modal overlay shown.">
      <DCArtboard id="staff-list" label="Staff list · one selected" width={1440} height={1000}>
        <Frame url="shipx.co/admin/users" h={1000}><StaffList /></Frame>
      </DCArtboard>
      <DCArtboard id="staff-invite" label="Invite staff modal" width={1440} height={1000}>
        <Frame url="shipx.co/admin/users" h={1000}><StaffList withModal /></Frame>
      </DCArtboard>
    </DCSection>

    <DCSection id="profile" title="3.4 — Staff Profile" subtitle="Hero · Profile + Permissions side-by-side · Activity log · Danger zone.">
      <DCArtboard id="staff-profile" label="Staff profile · Kwame Asante" width={1440} height={1400}>
        <Frame url="shipx.co/admin/users/kwame" h={1400}><StaffProfile /></Frame>
      </DCArtboard>
    </DCSection>

    <DCSection id="customers" title="3.5 — Customer List" subtitle="GDPR banner · 4 stats · 8-row table with consent chips, anonymised row, outstanding amounts.">
      <DCArtboard id="customer-list" label="Customer list" width={1440} height={1100}>
        <Frame url="shipx.co/admin/customers" h={1100}><CustomerList /></Frame>
      </DCArtboard>
    </DCSection>

    <DCSection id="customer-detail" title="3.6 — Customer Profile" subtitle="Hero · 5-tab strip · Profile, Shipments, and Billing tabs designed.">
      <DCArtboard id="customer-profile" label="Profile tab" width={1440} height={1280}>
        <Frame url="shipx.co/admin/customers/ngozi" h={1280}><CustomerProfile tab="profile" /></Frame>
      </DCArtboard>
      <DCArtboard id="customer-shipments" label="Shipments tab" width={1440} height={900}>
        <Frame url="shipx.co/admin/customers/ngozi/shipments" h={900}><CustomerProfile tab="shipments" /></Frame>
      </DCArtboard>
      <DCArtboard id="customer-billing" label="Billing tab" width={1440} height={1100}>
        <Frame url="shipx.co/admin/customers/ngozi/billing" h={1100}><CustomerProfile tab="billing" /></Frame>
      </DCArtboard>
    </DCSection>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
