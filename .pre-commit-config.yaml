repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: python3 -m mypy
        language: system
        types: [python]
        args:
          - --ignore-missing-imports
          - --config-file=pyproject.toml
          - shared/
          - services/
        pass_filenames: false
        always_run: true
        additional_dependencies: []
