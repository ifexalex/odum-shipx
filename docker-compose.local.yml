version: "3.9"

services:
  # ─── PostgreSQL (replaces Aurora Serverless) ────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: shipx_postgres
    environment:
      POSTGRES_DB: logistics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpassword
    ports:
      - "5432:5432"
    volumes:
      - shipx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logistics"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Moto (SQS, EventBridge, S3, Secrets Manager, Cognito, IAM) ─────────────
  # Free open-source AWS emulator — replaces LocalStack Community (deprecated Mar 2026)
  # Docs: https://docs.getmoto.org/en/latest/docs/server_mode.html
  moto:
    # Pinned, not :latest (2026-11-24): moto 5.2.6 answers the browser's CORS preflight with a 500 (an internal
    # AssertionError), so the frontend's direct Cognito sign-in never leaves the browser. CI pulls the image fresh
    # on every run, so that release broke every real-login e2e test. 5.2.5 matches the moto pin in pyproject.toml.
    image: motoserver/moto:5.2.5
    container_name: shipx_moto
    ports:
      - "5100:5100"
    environment:
      - MOTO_PORT=5100
    healthcheck:
      test: ["CMD-SHELL", "curl -s --max-time 3 http://localhost:5100/moto-api/dashboard > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Azurite (Azure Blob/Queue/Table emulator) — Azure portability target ──
  # Microsoft's official local Azure Storage emulator. Optional: the pytest suite
  # is fully mocked and does NOT need it — it's used only by scripts/azure_smoke.py
  # for live SAS round-trips without a real Azure subscription. Public dev creds:
  #   AccountName=devstoreaccount1  (standard Azurite account)
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: shipx_azurite
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck"
    ports:
      - "10000:10000"  # blob
      - "10001:10001"  # queue
      - "10002:10002"  # table

  # ─── Redis (replaces per-Lambda-instance in-memory cache) ──────────────────
  redis:
    image: redis:7-alpine
    container_name: shipx_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Adminer (web-based DB UI) ──────────────────────────────────────────────
  adminer:
    image: adminer:4
    container_name: shipx_adminer
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  shipx_pgdata:
