version: "3.9"

services:
  # ─── PostgreSQL (replaces Aurora Serverless) ────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: shipx_postgres
    environment:
      POSTGRES_DB: logistics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpassword
    ports:
      - "5432:5432"
    volumes:
      - shipx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logistics"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Moto (SQS, EventBridge, S3, Secrets Manager, Cognito, IAM) ─────────────
  # Free open-source AWS emulator — replaces LocalStack Community (deprecated Mar 2026)
  # Docs: https://docs.getmoto.org/en/latest/docs/server_mode.html
  moto:
    image: motoserver/moto:latest
    container_name: shipx_moto
    ports:
      - "5100:5100"
    environment:
      - MOTO_PORT=5100
    healthcheck:
      test: ["CMD-SHELL", "curl -s --max-time 3 http://localhost:5100/moto-api/dashboard > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis (replaces per-Lambda-instance in-memory cache) ──────────────────
  redis:
    image: redis:7-alpine
    container_name: shipx_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Adminer (web-based DB UI) ──────────────────────────────────────────────
  adminer:
    image: adminer:4
    container_name: shipx_adminer
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  shipx_pgdata:
