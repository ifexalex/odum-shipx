name: Deploy Pipeline (Azure)

# Azure analogue of deploy.yml. Same promotion model — push to main → dev,
# v*.*.*-rc* tag → staging, v*.*.* tag → prod, workflow_dispatch → demo — but it
# builds + pushes a container image to ACR and rolls the Container Apps, instead
# of updating Lambda. Every job is gated on `vars.DEPLOY_CLOUD == 'azure'`, so it
# is dormant until the single cloud switch selects Azure (see deploy.yml for the
# AWS side, gated `!= 'azure'`).
#
# Unlike the AWS pipeline there is no artifact-resolution job: the image is built
# here from the checked-out commit (which has already passed CI).

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'   # staging
      - 'v[0-9]+.[0-9]+.[0-9]+'             # prod
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, staging, prod, demo]

# Queue deploys — never cancel one mid-run.
concurrency:
  group: deploy-azure-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── Dev — auto on every successful CI run on main ───────────────────────
  deploy-dev:
    if: >-
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')) &&
      vars.DEPLOY_CLOUD == 'azure'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-azure-env.yml
    with:
      environment: dev
    secrets: inherit

  # ── Staging — v*.*.*-rc* tag ────────────────────────────────────────────
  deploy-staging:
    if: >-
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-rc')) ||
       (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')) &&
      vars.DEPLOY_CLOUD == 'azure'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-azure-env.yml
    with:
      environment: staging
    secrets: inherit

  # ── Prod — v*.*.* tag (no -rc) ──────────────────────────────────────────
  deploy-prod:
    if: >-
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-rc')) ||
       (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')) &&
      vars.DEPLOY_CLOUD == 'azure'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-azure-env.yml
    with:
      environment: prod
    secrets: inherit

  # ── Demo — standalone, dispatch-only ────────────────────────────────────
  deploy-demo:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'demo' && vars.DEPLOY_CLOUD == 'azure'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-azure-env.yml
    with:
      environment: demo
    secrets: inherit
