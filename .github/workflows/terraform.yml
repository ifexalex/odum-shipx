name: Terraform

# AWS Terraform validation on PRs and progressive dev -> staging -> prod apply
# on pushes to main. Staging and prod are gated by GitHub Environment protection
# rules (required reviewers). Demo is standalone and dispatch-only.

on:
  pull_request:
    branches: [main]
    paths:
      - "infrastructure/aws/**"
      - "infrastructure/common/**"
      - ".github/workflows/terraform.yml"
      - ".github/actions/terraform-run/**"
  push:
    branches: [main]
    paths:
      - "infrastructure/aws/**"
      - "infrastructure/common/**"
      - ".github/workflows/terraform.yml"
      - ".github/actions/terraform-run/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply (dev/staging/prod run sequentially from the selected one; demo is standalone)"
        required: true
        type: choice
        options: [dev, staging, prod, demo]
        default: dev

permissions:
  contents: read

jobs:
  # ── Credential-free fmt + validate on PRs and pushes to main ─────────────
  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7.5"
      - name: Terraform Format Check
        working-directory: infrastructure/aws
        run: terraform fmt -check -recursive
      - name: Terraform Validate
        working-directory: infrastructure/aws
        run: |
          terraform init -backend=false
          terraform validate

  # ── Dev — auto-applies on every AWS infra push to main ───────────────────
  terraform-dev:
    needs: validate
    if: >-
      always() && vars.DEPLOY_CLOUD != 'azure' && (
        (github.event_name == 'push' && needs.validate.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
      )
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: terraform-aws-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
      - uses: ./.github/actions/terraform-run
        with:
          working-directory: infrastructure/aws
          environment: dev
          mode: apply
          import-aws-bootstrap: "true"

  # ── Staging — gated by dev success (on push/dev-dispatch) + env approval ─
  terraform-staging:
    needs: terraform-dev
    if: >-
      always() && vars.DEPLOY_CLOUD != 'azure' && (
        ((github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')) &&
          needs.terraform-dev.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
      )
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: terraform-aws-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
      - uses: ./.github/actions/terraform-run
        with:
          working-directory: infrastructure/aws
          environment: staging
          mode: apply

  # ── Prod — gated by staging success (on push/dev/staging-dispatch) + approval
  terraform-prod:
    needs: terraform-staging
    if: >-
      always() && vars.DEPLOY_CLOUD != 'azure' && (
        ((github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && (inputs.environment == 'dev' || inputs.environment == 'staging'))) &&
          needs.terraform-staging.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')
      )
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: terraform-aws-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
      - uses: ./.github/actions/terraform-run
        with:
          working-directory: infrastructure/aws
          environment: prod
          mode: apply

  # ── Demo — standalone, dispatch-only (NOT in the dev->staging->prod chain)
  terraform-demo:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'demo' && vars.DEPLOY_CLOUD != 'azure'
    runs-on: ubuntu-latest
    environment: demo
    concurrency:
      group: terraform-aws-demo
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
      - uses: ./.github/actions/terraform-run
        with:
          working-directory: infrastructure/aws
          environment: demo
          mode: apply
          import-aws-bootstrap: "true"
