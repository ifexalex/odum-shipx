name: Frontend Deploy (AWS or Azure)

# Cloud-selectable frontend deployment. Pick the target with the `cloud` input;
# the same built dist/ is published to either AWS (S3 + CloudFront) or Azure
# (Blob $web + Front Door). ShipX runs on one cloud at a time — this just
# chooses which one this deploy targets.
#
# Required secrets (set per GitHub Environment):
#   Shared build:
#     VITE_COGNITO_USER_POOL_ID, VITE_COGNITO_CLIENT_ID   (AWS/Cognito login)
#     VITE_API_BASE_URL            (AWS backend URL; Azure reads its API URL from Terraform)
#   Auth provider + Entra values are resolved automatically: on Azure they come
#   from Terraform (frontend_auth_provider=entra, entra_client_id,
#   entra_token_endpoint — public ids, not secrets); on AWS they fall back to the
#   optional VITE_AUTH_PROVIDER / VITE_ENTRA_* secrets, defaulting to cognito. So
#   the SPA authenticates against Entra (Azure) or Cognito (AWS) with no manual
#   provider flag to keep in sync.
#   AWS deploy (cloud=aws):
#     FRONTEND_DEPLOY_ROLE_ARN     (OIDC role: s3:PutObject + cloudfront:CreateInvalidation)
#     FRONTEND_S3_BUCKET, FRONTEND_CLOUDFRONT_ID
#   Azure deploy (cloud=azure):
#     AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID   (OIDC federated SP)
#        → the SP needs "Storage Blob Data Contributor" on the storage account,
#          a role allowing `az afd endpoint purge`, and read access to the tfstate.
#   The storage account / Front Door profile+endpoint / resource group / API URL
#   are read from Terraform state — NOT secrets — so there is nothing extra to keep
#   in sync (matches the backend deploy-azure.yml pattern).

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: "Target cloud"
        type: choice
        options: [aws, azure]
        default: aws
      environment:
        description: "Environment"
        type: choice
        options: [prod, staging, dev, demo]
        default: prod

concurrency:
  group: frontend-deploy-${{ inputs.cloud }}-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC for both AWS assume-role and Azure login

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # ── Azure: login + resolve infra from Terraform state (before build, so the
      #    SPA can be built against the real Azure API URL) ────────────────────
      - name: Azure — login (OIDC)
        if: inputs.cloud == 'azure'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure — setup Terraform
        if: inputs.cloud == 'azure'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7.5"

      - name: Azure — read infra outputs
        if: inputs.cloud == 'azure'
        id: tf
        working-directory: infrastructure/azure
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform init -backend-config=environments/${{ inputs.environment }}.backend.hcl
          SA=$(terraform output -raw frontend_storage_account)
          RG=$(terraform output -raw resource_group)
          {
            echo "storage_account=$SA"
            echo "rg=$RG"
            echo "profile=$(terraform output -raw frontend_frontdoor_profile)"
            echo "endpoint=$(terraform output -raw frontend_frontdoor_endpoint)"
            # API is served same-origin via the Front Door /v1/* route, so the SPA's
            # API base is the Front Door URL (first-party cookies, no CORS), not the
            # direct Container App URL.
            echo "api_base=$(terraform output -raw frontend_url)"
            # Entra SPA build values (public ids) — so Azure needs no VITE_ENTRA_* secrets.
            echo "auth_provider=$(terraform output -raw frontend_auth_provider)"
            echo "entra_client_id=$(terraform output -raw entra_client_id)"
            echo "entra_token_endpoint=$(terraform output -raw entra_token_endpoint)"
            # Platform-admin group id (+ optional group-id map): the SPA maps the
            # token's group GUIDs back to canonical role names, mirroring the
            # backend EntraClaimsMapper. Public ids, not secrets.
            echo "entra_platform_admin_group_id=$(terraform output -raw entra_platform_admin_group_id)"
            echo "entra_group_id_map=$(terraform output -raw entra_group_id_map)"
          } >> "$GITHUB_OUTPUT"
          # Upload with the storage key via --account-key — no data-plane RBAC role
          # needed on the Contributor-only deploy identity. Fetched via control-plane
          # listKeys (Contributor has it), so there's no dependency on a freshly
          # applied TF output. Masked so it never prints.
          KEY=$(az storage account keys list -g "$RG" -n "$SA" --query "[0].value" -o tsv)
          echo "::add-mask::$KEY"
          echo "storage_key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Build (${{ inputs.cloud }} / ${{ inputs.environment }})
        run: npm run build
        env:
          # Azure: the Front Door URL (same-origin API via /v1/*); AWS: the secret.
          VITE_API_BASE_URL: ${{ steps.tf.outputs.api_base || secrets.VITE_API_BASE_URL }}
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID }}
          # Provider + Entra values: Azure supplies them from Terraform (so the
          # build can't be misconfigured and needs no VITE_ENTRA_* secrets); AWS
          # falls back to secrets, defaulting to cognito. Both clouds are supported.
          VITE_AUTH_PROVIDER: ${{ steps.tf.outputs.auth_provider || secrets.VITE_AUTH_PROVIDER || 'cognito' }}
          VITE_ENTRA_TOKEN_ENDPOINT: ${{ steps.tf.outputs.entra_token_endpoint || secrets.VITE_ENTRA_TOKEN_ENDPOINT }}
          VITE_ENTRA_CLIENT_ID: ${{ steps.tf.outputs.entra_client_id || secrets.VITE_ENTRA_CLIENT_ID }}
          # Entra group-id → canonical role mapping (SPA mirrors the backend mapper).
          VITE_ENTRA_PLATFORM_ADMIN_GROUP_ID: ${{ steps.tf.outputs.entra_platform_admin_group_id || secrets.VITE_ENTRA_PLATFORM_ADMIN_GROUP_ID }}
          VITE_ENTRA_GROUP_ID_MAP: ${{ steps.tf.outputs.entra_group_id_map || secrets.VITE_ENTRA_GROUP_ID_MAP }}
          VITE_ENVIRONMENT: ${{ inputs.environment }}

      # ----------------------------------------------------------------- AWS
      - name: AWS — configure credentials (OIDC)
        if: inputs.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: AWS — sync hashed assets (immutable)
        if: inputs.cloud == 'aws'
        run: |
          aws s3 sync dist/ s3://${{ secrets.FRONTEND_S3_BUCKET }} \
            --delete --exclude "index.html" \
            --cache-control "max-age=31536000,immutable" --metadata-directive REPLACE

      - name: AWS — upload index.html (no-cache)
        if: inputs.cloud == 'aws'
        run: |
          aws s3 cp dist/index.html s3://${{ secrets.FRONTEND_S3_BUCKET }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate" --metadata-directive REPLACE

      - name: AWS — invalidate CloudFront /index.html
        if: inputs.cloud == 'aws'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.FRONTEND_CLOUDFRONT_ID }} --paths "/index.html"

      # --------------------------------------------------------------- Azure
      - name: Azure — upload hashed assets (immutable)
        if: inputs.cloud == 'azure'
        run: |
          az storage blob upload-batch \
            --account-name "${{ steps.tf.outputs.storage_account }}" \
            --account-key "${{ steps.tf.outputs.storage_key }}" \
            --destination '$web' --source dist \
            --content-cache 'public, max-age=31536000, immutable' --overwrite

      - name: Azure — upload index.html (no-cache)
        if: inputs.cloud == 'azure'
        run: |
          az storage blob upload \
            --account-name "${{ steps.tf.outputs.storage_account }}" \
            --account-key "${{ steps.tf.outputs.storage_key }}" \
            --container-name '$web' --name index.html --file dist/index.html \
            --content-cache 'no-cache, no-store, must-revalidate' --overwrite

      - name: Azure — purge Front Door
        if: inputs.cloud == 'azure'
        run: |
          az afd endpoint purge \
            --resource-group "${{ steps.tf.outputs.rg }}" \
            --profile-name "${{ steps.tf.outputs.profile }}" \
            --endpoint-name "${{ steps.tf.outputs.endpoint }}" \
            --content-paths '/*'

      - name: Summary
        run: echo "✅ Frontend deployed to ${{ inputs.cloud }} (${{ inputs.environment }}) — commit ${{ github.sha }}"
