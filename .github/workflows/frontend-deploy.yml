name: Frontend Deploy (AWS or Azure)

# Single cloud-selectable frontend deployment workflow for BOTH Azure (Blob $web
# + Front Door) and AWS (S3 + CloudFront).
#
# - Auto-deploys `dev` on every successful Frontend CI run on `main`, targeting
#   whichever cloud `vars.DEPLOY_CLOUD` selects (`azure` when 'azure', else `aws`),
#   checked out at the exact verified `workflow_run.head_sha` (never floating HEAD).
# - Manual `workflow_dispatch` defaults safely to `azure` / `dev` (prod must be
#   chosen deliberately) and supports an optional `ref` for 1-click rollback.

on:
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      cloud:
        description: "Target cloud"
        type: choice
        options: [azure, aws]
        default: azure
      environment:
        description: "Environment (prod must be chosen deliberately)"
        type: choice
        options: [dev, staging, demo, prod]
        default: dev
      ref:
        description: "Optional git ref (SHA, tag, or branch) for rollback — defaults to current branch HEAD"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write # OIDC for both AWS assume-role and Azure login

jobs:
  # Resolve cloud, environment, and exact commit ref once before entering the
  # deployment job (where `environment:` and job-level `concurrency:` read outputs).
  resolve:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      cloud: ${{ steps.pick.outputs.cloud }}
      environment: ${{ steps.pick.outputs.environment }}
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CLOUD: ${{ inputs.cloud }}
          INPUT_ENV: ${{ inputs.environment }}
          INPUT_REF: ${{ inputs.ref }}
          DEPLOY_CLOUD_VAR: ${{ vars.DEPLOY_CLOUD }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_SHA_VAL: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            cloud="${INPUT_CLOUD:-azure}"
            env_name="${INPUT_ENV:-dev}"
            target_ref="${INPUT_REF:-$GITHUB_SHA_VAL}"
          else
            if [ "$DEPLOY_CLOUD_VAR" = "azure" ]; then
              cloud="azure"
            else
              cloud="aws"
            fi
            env_name="dev"
            target_ref="$WORKFLOW_RUN_SHA"
          fi
          echo "cloud=${cloud}" >> "$GITHUB_OUTPUT"
          echo "environment=${env_name}" >> "$GITHUB_OUTPUT"
          echo "ref=${target_ref}" >> "$GITHUB_OUTPUT"
          echo "Target: ${cloud} / ${env_name} @ ${target_ref} (event: ${EVENT_NAME})"

  deploy:
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    concurrency:
      group: frontend-deploy-${{ needs.resolve.outputs.cloud }}-${{ needs.resolve.outputs.environment }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Resolve canonical commit SHA
        id: meta
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # ── Azure: login + resolve infra from Terraform state ──────────────────
      - name: Azure — login (OIDC)
        if: needs.resolve.outputs.cloud == 'azure'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure — setup Terraform
        if: needs.resolve.outputs.cloud == 'azure'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7.5"

      - name: Azure — read infra outputs
        if: needs.resolve.outputs.cloud == 'azure'
        id: tf
        working-directory: infrastructure/azure
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          terraform init -backend-config="environments/${{ needs.resolve.outputs.environment }}.backend.hcl"
          SA=$(terraform output -raw frontend_storage_account)
          RG=$(terraform output -raw resource_group)
          {
            echo "storage_account=$SA"
            echo "rg=$RG"
            echo "profile=$(terraform output -raw frontend_frontdoor_profile)"
            echo "endpoint=$(terraform output -raw frontend_frontdoor_endpoint)"
            echo "api_base=$(terraform output -raw frontend_url)"
            echo "auth_provider=$(terraform output -raw frontend_auth_provider)"
            echo "entra_client_id=$(terraform output -raw entra_client_id)"
            echo "entra_token_endpoint=$(terraform output -raw entra_token_endpoint)"
            echo "entra_platform_admin_group_id=$(terraform output -raw entra_platform_admin_group_id)"
            echo "entra_group_id_map=$(terraform output -raw entra_group_id_map)"
          } >> "$GITHUB_OUTPUT"
          KEY=$(az storage account keys list -g "$RG" -n "$SA" --query "[0].value" -o tsv)
          echo "::add-mask::$KEY"
          echo "storage_key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Build (${{ needs.resolve.outputs.cloud }} / ${{ needs.resolve.outputs.environment }})
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ steps.tf.outputs.api_base || secrets.VITE_API_BASE_URL }}
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID }}
          VITE_AUTH_PROVIDER: ${{ steps.tf.outputs.auth_provider || secrets.VITE_AUTH_PROVIDER || 'cognito' }}
          VITE_ENTRA_TOKEN_ENDPOINT: ${{ steps.tf.outputs.entra_token_endpoint || secrets.VITE_ENTRA_TOKEN_ENDPOINT }}
          VITE_ENTRA_CLIENT_ID: ${{ steps.tf.outputs.entra_client_id || secrets.VITE_ENTRA_CLIENT_ID }}
          VITE_ENTRA_PLATFORM_ADMIN_GROUP_ID: ${{ steps.tf.outputs.entra_platform_admin_group_id || secrets.VITE_ENTRA_PLATFORM_ADMIN_GROUP_ID }}
          VITE_ENTRA_GROUP_ID_MAP: ${{ steps.tf.outputs.entra_group_id_map || secrets.VITE_ENTRA_GROUP_ID_MAP }}
          VITE_ENVIRONMENT: ${{ needs.resolve.outputs.environment }}

      # ----------------------------------------------------------------- AWS
      - name: AWS — configure credentials (OIDC)
        if: needs.resolve.outputs.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: AWS — upload hashed assets (immutable)
        if: needs.resolve.outputs.cloud == 'aws'
        run: |
          set -euo pipefail
          aws s3 sync dist/assets/ "s3://${{ secrets.FRONTEND_S3_BUCKET }}/assets/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --metadata-directive REPLACE

      - name: AWS — upload unhashed root files and index.html (no-cache)
        if: needs.resolve.outputs.cloud == 'aws'
        run: |
          set -euo pipefail
          # Upload non-HTML static files (theme-init.js, favicon.svg) without immutable caching.
          aws s3 sync dist/ "s3://${{ secrets.FRONTEND_S3_BUCKET }}/" \
            --exclude "assets/*" \
            --exclude "index.html" \
            --cache-control "no-cache,must-revalidate" \
            --metadata-directive REPLACE
          # Upload index.html LAST so users never see references to missing chunks.
          aws s3 cp dist/index.html "s3://${{ secrets.FRONTEND_S3_BUCKET }}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --metadata-directive REPLACE

      - name: AWS — invalidate CloudFront entry points
        if: needs.resolve.outputs.cloud == 'aws'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.FRONTEND_CLOUDFRONT_ID }}" \
            --paths "/index.html" "/theme-init.js"

      # --------------------------------------------------------------- Azure
      - name: Azure — upload hashed assets (immutable)
        if: needs.resolve.outputs.cloud == 'azure'
        run: |
          set -euo pipefail
          az storage blob upload-batch \
            --account-name "${{ steps.tf.outputs.storage_account }}" \
            --account-key "${{ steps.tf.outputs.storage_key }}" \
            --destination '$web' \
            --destination-path assets \
            --source dist/assets \
            --content-cache 'public, max-age=31536000, immutable' \
            --overwrite

      - name: Azure — upload unhashed root files and index.html (no-cache)
        if: needs.resolve.outputs.cloud == 'azure'
        run: |
          set -euo pipefail
          # Upload non-hashed public files (favicon.svg, theme-init.js) with no-cache
          # so they never get frozen for 1 year, then upload index.html LAST so there
          # is zero race window where index.html carries immutable cache headers.
          for file in dist/*; do
            [ -f "$file" ] || continue
            base=$(basename "$file")
            [ "$base" = "index.html" ] && continue
            az storage blob upload \
              --account-name "${{ steps.tf.outputs.storage_account }}" \
              --account-key "${{ steps.tf.outputs.storage_key }}" \
              --container-name '$web' \
              --name "$base" \
              --file "$file" \
              --content-cache 'no-cache, must-revalidate' \
              --overwrite
          done
          az storage blob upload \
            --account-name "${{ steps.tf.outputs.storage_account }}" \
            --account-key "${{ steps.tf.outputs.storage_key }}" \
            --container-name '$web' \
            --name index.html \
            --file dist/index.html \
            --content-cache 'no-cache, no-store, must-revalidate' \
            --overwrite

      - name: Azure — purge Front Door entry points
        if: needs.resolve.outputs.cloud == 'azure'
        run: |
          az afd endpoint purge \
            --resource-group "${{ steps.tf.outputs.rg }}" \
            --profile-name "${{ steps.tf.outputs.profile }}" \
            --endpoint-name "${{ steps.tf.outputs.endpoint }}" \
            --content-paths '/' '/index.html' '/theme-init.js'

      - name: Summary
        run: echo "Frontend deployed to ${{ needs.resolve.outputs.cloud }} (${{ needs.resolve.outputs.environment }}) — commit ${{ steps.meta.outputs.sha }}"
