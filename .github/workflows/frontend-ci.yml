name: Frontend CI

# Path filter covers frontend sources AND the backend/stack files that govern
# whether the local stack boots for e2e-local-stack (env samples, migrations,
# dev scripts, DB layer, compose, Makefile, and the shared composite actions).
# Paths are duplicated between pull_request and push on purpose: GitHub Actions
# does not support YAML anchors.
on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - ".github/actions/setup-playwright/**"
      - ".github/actions/start-local-stack/**"
      - ".env.local.sample"
      - "migrations/**"
      - "scripts/**"
      - "shared/db.py"
      - "shared/db_credentials.py"
      - "docker-compose.local.yml"
      - "Makefile"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
      - ".github/actions/setup-playwright/**"
      - ".github/actions/start-local-stack/**"
      - ".env.local.sample"
      - "migrations/**"
      - "scripts/**"
      - "shared/db.py"
      - "shared/db_credentials.py"
      - "docker-compose.local.yml"
      - "Makefile"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: Frontend CI never deploys directly (frontend-deploy.yml owns
# both AWS and Azure deploys via workflow_run / workflow_dispatch).
permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high

      # Security & design-system static checks that TypeScript cannot enforce.
      - name: "Security: no localStorage/sessionStorage in auth layer"
        run: |
          HITS=$(grep -rnE --include="*.ts" --include="*.tsx" \
            "(window\.)?(localStorage|sessionStorage)\.(getItem|setItem|removeItem|clear|key|length)" \
            src/auth/ | grep -vE "\.test\.tsx?:" || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "Token storage violation: localStorage/sessionStorage access found in src/auth/"
            echo "Tokens must stay in memory only (11_security_and_compliance.md)."
            exit 1
          fi
          echo "OK: No localStorage/sessionStorage access in src/auth/"

      - name: "Security: no dangerouslySetInnerHTML in app code"
        run: |
          if grep -rn --include="*.tsx" "dangerouslySetInnerHTML" src/; then
            echo "XSS risk: dangerouslySetInnerHTML found in src/"
            echo "Render tenant-supplied content as escaped React nodes (11_security_and_compliance.md)."
            exit 1
          fi
          echo "OK: No dangerouslySetInnerHTML in src/"

      - name: "Design: no token-duplicating hex colours in pages"
        run: |
          TOKENS='#(1c7922|14471a|155f1b|2dc438|d6f5da|f3fcf4|0b2f0d|9a3412|7c2d12|c2410c|fed7aa|1c1b1c|374151|666666|6b7280|16a34a|d97706|dc2626|2563eb|7c3aed|4f46e5|ede9fe)'
          HITS=$(grep -rnoiE "$TOKENS" src/pages --include="*.tsx" \
            | grep -v "src/pages/print/" \
            | grep -v "\.test\." \
            | grep -viE "fill=|stopColor|<svg|<path|<circle|<rect|routeGrad|KolaMark|illustration" || true)
          if [ -n "$HITS" ]; then
            echo "Token-duplicating hex colour(s) in page code — use var(--color-*):"
            echo "$HITS"
            exit 1
          fi
          echo "OK: No token-duplicating hex colours in pages"

  # ──────────────────────────────────────────────────────────────────────────
  # Playwright smoke — headless browser check against the production build.
  # ──────────────────────────────────────────────────────────────────────────
  e2e-smoke:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: ./.github/actions/setup-playwright
      - run: npm run build
      - name: Run smoke e2e
        run: npx playwright test --project=smoke
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-smoke-report
          path: frontend/playwright-report/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Playwright local-stack — real Flask API + Postgres + Moto + Redis flows.
  # ──────────────────────────────────────────────────────────────────────────
  e2e-local-stack:
    runs-on: ubuntu-latest
    needs: build-and-test
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: ./.github/actions/start-local-stack

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - uses: ./.github/actions/setup-playwright

      - name: Start Vite dev server (background, local-auth mode)
        working-directory: frontend
        env:
          VITE_ENVIRONMENT: local
        run: |
          set -euo pipefail
          nohup npm run dev -- --port 5173 > vite.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "Vite dev server is ready."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Vite dev server did not start within 60s"
          tail -n 100 vite.log || true
          exit 1

      - name: Run local-stack e2e flows
        working-directory: frontend
        env:
          PW_E2E: local-stack
        run: |
          set -euo pipefail
          set -a; source ../.env.local; set +a
          npx playwright test --project=local-stack

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-local-stack-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            flask.log
            frontend/vite.log
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Visual baseline (audit FD-38) — before/after screenshots on PRs that touch
  # CSS or frontend/src/design/. Differences are listed in the job summary.
  # ──────────────────────────────────────────────────────────────────────────
  visual:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build-and-test
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Does this pull request change styles?
        id: styles
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | grep -E '^frontend/src/(design/|.*\.css$)' || true)
          echo "$changed"
          if [ -n "$changed" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v7
        if: steps.styles.outputs.run
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: ./.github/actions/start-local-stack
        if: steps.styles.outputs.run

      - name: Install frontend deps (PR and base worktree)
        if: steps.styles.outputs.run
        run: |
          set -euo pipefail
          git worktree add ../base "origin/${{ github.base_ref }}"
          cp frontend/.env.local ../base/frontend/.env.local
          (cd frontend && npm ci)
          (cd ../base/frontend && npm ci)

      - uses: ./.github/actions/setup-playwright
        if: steps.styles.outputs.run

      - name: Capture the base branch
        if: steps.styles.outputs.run
        env:
          VITE_ENVIRONMENT: local
        run: |
          set -euo pipefail
          (cd ../base/frontend && nohup npm run dev -- --port 5173 > vite-base.log 2>&1 &)
          for _ in $(seq 1 60); do
            curl -sf http://localhost:5173 > /dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:5173 > /dev/null 2>&1 || { echo "::error::Base Vite failed"; exit 1; }
          (cd frontend && npm run visual:baseline)
          pkill -f "vite.*--port 5173" || true
          for _ in $(seq 1 30); do
            curl -sf http://localhost:5173 > /dev/null 2>&1 || break
            sleep 1
          done

      - name: Compare the pull request against it
        if: steps.styles.outputs.run
        env:
          VITE_ENVIRONMENT: local
        run: |
          set -euo pipefail
          cd frontend
          nohup npm run dev -- --port 5173 > vite.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:5173 > /dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:5173 > /dev/null 2>&1 || { echo "::error::PR Vite failed"; exit 1; }
          PLAYWRIGHT_JSON_OUTPUT_NAME=visual.json npx playwright test --project=visual --reporter=list,html,json || true
          node -e '
            const json = JSON.parse(require("fs").readFileSync("visual.json", "utf8"));
            const changed = [];
            const walk = (s, trail) => { for (const c of s.suites ?? []) walk(c, [...trail, c.title]);
              for (const sp of s.specs ?? []) if (!sp.ok) changed.push(`${trail.filter(Boolean).slice(-1)[0]} ${sp.title}`); };
            walk(json, []);
            const lines = changed.length ? changed.map((c) => `- ${c}`).join("\n") : "No screen changed.";
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Visual changes (${changed.length})\n\n${lines}\n\nBefore, after and diff images: the visual-report artifact.\n`);
          '

      - uses: actions/upload-artifact@v7
        if: steps.styles.outputs.run
        with:
          name: visual-report
          path: |
            frontend/playwright-report/
            flask.log
            frontend/vite.log
          retention-days: 14
