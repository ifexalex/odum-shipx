name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same ref — newer commit supersedes older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast (~3s) fail-open path classifier. Kept as a job (rather than workflow-level
  # paths-ignore) so docs-only and frontend-UI-only PRs skip lint/test/security
  # cleanly without leaving GitHub branch-protection required checks stuck waiting.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess

          event = os.environ["EVENT_NAME"]
          if event == "pull_request":
              cmd = ["git", "diff", "--name-only", f"origin/{os.environ['BASE_REF']}...HEAD"]
              files = subprocess.check_output(cmd, text=True).splitlines()
          else:
              before = os.environ.get("BEFORE_SHA", "")
              zero = "0" * 40
              if before and before != zero:
                  check = subprocess.run(
                      ["git", "cat-file", "-e", f"{before}^{{commit}}"],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
                  if check.returncode == 0:
                      cmd = ["git", "diff", "--name-only", before, os.environ["HEAD_SHA"]]
                      files = subprocess.check_output(cmd, text=True).splitlines()
                  else:
                      files = []
              else:
                  files = []

          def is_backend(path: str) -> bool:
              # frontend/src/api/* is checked by test_infrastructure_contracts.py
              # against AWS API Gateway routes.
              if path.startswith("frontend/src/api/"):
                  return True
              if path.endswith(".md") or path in {"LICENSE", ".gitignore"}:
                  return False
              if path.startswith(("docs/", "frontend/", ".github/workflows/frontend-")):
                  return False
              return True

          # Fail-open when diff is empty or unavailable.
          backend = True if not files else any(is_backend(f) for f in files)
          print(f"Changed files ({len(files)}): backend={backend}")
          for f in files[:30]:
              print(f"  - {f}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"backend={'true' if backend else 'false'}\n")
          PY

  lint:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Fails if pyproject.toml and uv.lock disagree (uv.lock is the source of truth).
      - name: Check uv.lock is in sync with pyproject.toml
        run: uv lock --check
      - run: uv sync --frozen --extra azure
      - name: Lint with ruff
        run: uv run ruff check .
      - name: Check formatting with ruff
        run: uv run ruff format --check .
      - name: Type-check with mypy
        run: uv run mypy shared/ services/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # Job-level so the coverage step's `if` can test it. A step cannot read its
    # own `env:` in its own `if`, and `secrets` is not dependable there.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: logistics_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The rate limiter's Lua script is only meaningful against a real Redis
      # (tests/db/test_rate_limit_redis.py); without one those tests fail on CI.
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --extra azure
      - name: Run migrations
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: logistics_test
          DATABASE_USER: test_user
          DATABASE_PASSWORD: test_pass
          # Migration 060 sets this as logistics_app's password so CI exercises
          # the real non-owner application credential against RLS. Throwaway value
          # for an ephemeral container, not a secret.
          APP_DB_PASSWORD: ci_app_pass_not_a_secret
        run: uv run python scripts/migrate.py
      - name: Run unit tests
        env:
          PYTHONPATH: ".:services"
        run: uv run pytest tests/unit/ -v --cov=services --cov=shared --cov-report=xml
      # Audit OPS-03: money services may not lose unit-test coverage.
      - name: Enforce coverage floors
        run: uv run python scripts/check_coverage.py coverage.xml
      - name: Run tenant isolation tests
        env:
          PYTHONPATH: ".:services"
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: logistics_test
          DATABASE_USER: logistics_app
          DATABASE_PASSWORD: ci_app_pass_not_a_secret
          DATABASE_ADMIN_USER: test_user
          DATABASE_ADMIN_PASSWORD: test_pass
          APP_DB_PASSWORD: ci_app_pass_not_a_secret
        run: uv run pytest tests/tenant_isolation/ -v
      - name: Run integration tests
        env:
          PYTHONPATH: ".:services"
        run: uv run pytest tests/integration/ -v
      - name: Run database integrity tests
        env:
          PYTHONPATH: ".:services"
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: logistics_test
          DATABASE_USER: logistics_app
          DATABASE_PASSWORD: ci_app_pass_not_a_secret
          DATABASE_ADMIN_USER: test_user
          DATABASE_ADMIN_PASSWORD: test_pass
          APP_DB_PASSWORD: ci_app_pass_not_a_secret
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: uv run pytest tests/db/ -v
      - name: Upload coverage
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --extra azure
      - name: SAST scan (bandit)
        # Isolated tool env via uvx — immune to project-env plugin discovery quirks.
        run: uvx bandit@1.9.4 -r services/ shared/ -ll -q -c pyproject.toml
      - name: Dependency vulnerability scan (safety)
        run: |
          uv export --frozen --no-hashes --no-emit-project --no-default-groups --extra azure -o requirements-scan.txt
          uv run safety check -r requirements-scan.txt
      - name: Trivy filesystem scan
        # Pinned by SHA — update via Dependabot, never float @master.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
          format: 'table'

  # ── Build — runs only on AWS merges to main with backend changes ─────────
  # Gated on vars.DEPLOY_CLOUD != 'azure': Azure builds its container image in
  # _deploy-azure-env.yml and never downloads Lambda zips. Produces ONE shared
  # services.zip (instead of 20 identical copies), shared-layer.zip, and a lean
  # migrate.zip (~25 MB total instead of ~105 MB).
  build:
    runs-on: ubuntu-latest
    needs: [changes, lint, test, security]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.backend == 'true' &&
      vars.DEPLOY_CLOUD != 'azure'
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build shared Lambda layer
        run: |
          set -euo pipefail
          mkdir -p build/layer/python
          cp -r shared/ build/layer/python/shared/
          # Layer deps = project runtime deps + the `layer` group (alembic),
          # exported pinned from uv.lock and installed for arm64 Lambda.
          uv export --frozen --no-hashes --no-emit-project --no-default-groups --group layer -o build/layer-reqs.txt
          uv pip install \
            --python-platform aarch64-manylinux_2_28 \
            --python-version 3.13 \
            --target build/layer/python \
            --only-binary :all: \
            -r build/layer-reqs.txt
          (cd build/layer && zip -qr ../shared-layer.zip python/)

      - name: Build shared services zip
        run: |
          set -euo pipefail
          # Single archive shared by all 25 service/auth/notification/scheduled Lambdas.
          # Holds services/ twice: flattened at root (handler paths like
          # "tracking.handler.lambda_handler") and as the `services` package
          # (cross-service imports like `from services.billing.service import ...`).
          # Guarded by tests/unit/test_infrastructure_contracts.py::TestLambdaPackageLayout.
          mkdir -p build
          (cd services && zip -qr ../build/services.zip . --exclude "*/__pycache__/*" --exclude "*.pyc")
          zip -qr build/services.zip services --exclude "*/__pycache__/*" --exclude "*.pyc"

      - name: Build migration zip
        run: |
          set -euo pipefail
          # Lean package: migrations/ + handler.py. Runtime deps (alembic,
          # psycopg2-binary, boto3) and shared/ come from the newly published
          # shared-layer attached by _deploy-env.yml before invoking migrations —
          # eliminating hardcoded dependency versions that drifted from uv.lock.
          mkdir -p build/migrate_pkg
          cp -r migrations/ build/migrate_pkg/migrations/
          cp services/migrate/handler.py build/migrate_pkg/handler.py
          (cd build/migrate_pkg && zip -qr ../../build/migrate.zip .)

      - name: Upload lambda packages
        uses: actions/upload-artifact@v7
        with:
          name: lambda-packages-${{ github.run_id }}
          path: |
            build/shared-layer.zip
            build/services.zip
            build/migrate.zip
          # 7 days (clamped by the repository's "Artifact and log retention" setting).
          retention-days: 7
          if-no-files-found: error
