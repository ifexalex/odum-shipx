name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same ref — newer commit supersedes older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # uv auto-installs the interpreter pinned by requires-python (3.13).
      - run: uv sync --extra azure
      - name: Lint with ruff
        run: uv run ruff check .
      - name: Type-check with mypy
        run: uv run mypy shared/ services/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: logistics_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra azure
      - name: Run migrations
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: logistics_test
          DATABASE_USER: test_user
          DATABASE_PASSWORD: test_pass
        run: uv run python scripts/migrate.py
      - name: Run unit tests
        env:
          PYTHONPATH: ".:services"
        run: uv run pytest tests/unit/ -v --cov=services --cov=shared --cov-report=xml
      - name: Run tenant isolation tests
        env:
          PYTHONPATH: ".:services"
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: logistics_test
          DATABASE_USER: test_user
          DATABASE_PASSWORD: test_pass
        run: uv run pytest tests/tenant_isolation/ -v
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: coverage.xml
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra azure
      - name: SAST scan (bandit)
        # Run via uvx (isolated tool env) rather than the shared project venv:
        # a clean, complete install each run, immune to project-env/cache quirks
        # that broke bandit's plugin discovery under `uv run` on the CI runner.
        run: uvx bandit@1.9.4 -r services/ shared/ -ll -q -c pyproject.toml
      - name: Dependency vulnerability scan (safety)
        # Scan the resolved runtime deps (what ships), exported from the lock.
        run: |
          uv export --frozen --no-hashes --no-emit-project --no-default-groups --extra azure -o requirements-scan.txt
          uv run safety check -r requirements-scan.txt
      - name: Trivy filesystem scan
        # Pinned to v0.35.0 — update via Dependabot, never float @master
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'table'

  # ── Build — runs only on push to main (not on PRs) ──────────────────────
  # Produces the deployable artifact that all environments will use.
  # PRs run lint/test/security only — no artifact needed until merge.
  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build shared Lambda layer
        run: |
          mkdir -p build/layer/python
          cp -r shared/ build/layer/python/shared/
          # Layer deps = project runtime deps + the `layer` group (alembic),
          # exported pinned from uv.lock, installed for the arm64 Lambda target.
          uv export --frozen --no-hashes --no-emit-project --no-default-groups --group layer -o build/layer-reqs.txt
          uv pip install \
            --python-platform aarch64-manylinux_2_28 \
            --python-version 3.13 \
            --target build/layer/python \
            --only-binary :all: \
            -r build/layer-reqs.txt
          cd build/layer && zip -r ../shared-layer.zip python/

      - name: Build service zips
        run: |
          # Each zip contains the full services/ tree so cross-service imports resolve
          # (e.g. tracking imports from metering). Handler paths like
          # "tracking.handler.lambda_handler" resolve because tracking/handler.py sits
          # at the zip root (services/ is the zip root, not a subdirectory).
          for service in tenant_management packing_list manifest tracking billing claims \
                         payment_release refunds notification metering excel; do
            cd services
            zip -r ../build/${service}.zip . --exclude "*/__pycache__/*" --exclude "*.pyc"
            cd ..
          done

      - name: Build scheduled job zips
        run: |
          # Same full-services-tree approach — scheduled jobs also have intra-service imports.
          for job in storage_fee dispute_escalation sla_check storage_reminders \
                     data_cleanup usage_aggregation release_expiry; do
            cd services
            zip -r ../build/scheduled-${job}.zip . --exclude "*/__pycache__/*" --exclude "*.pyc"
            cd ..
          done

      - name: Build migration zip
        run: |
          mkdir -p build/migrate_pkg
          # The migrate Lambda is self-contained (does NOT use the shared layer):
          # bundle alembic + the DB driver directly, built for the arm64 target.
          uv pip install \
            --python-platform aarch64-manylinux_2_28 \
            --python-version 3.13 \
            --target build/migrate_pkg \
            --only-binary :all: \
            alembic==1.13.0 psycopg2-binary==2.9.11
          cp -r migrations/ build/migrate_pkg/migrations/
          cp services/migrate/handler.py build/migrate_pkg/handler.py
          cd build/migrate_pkg && zip -r ../../build/migrate.zip .

      - name: Upload lambda packages
        uses: actions/upload-artifact@v7
        with:
          name: lambda-packages-${{ github.run_id }}
          path: build/
          # 7 days, not 30. Each of these is ~105 MB and one is produced per
          # push to main, so 30 days of them reached 4.2 GB across 40 artifacts
          # and exhausted the account's artifact storage quota. GitHub then
          # stopped creating workflow runs at all ("Failed to CreateArtifact:
          # Artifact storage quota has been hit"), so CI went silent on new
          # pushes — a build failure on main that had nothing to do with the
          # code. A week of redeployable builds is enough; anything older is
          # rebuildable from its commit.
          #
          # NOTE: this value is CLAMPED by the repository's "Artifact and log
          # retention" setting and cannot exceed it. That setting was 1 day
          # (silently capping this to 1, so Deploy Pipeline — which fetches
          # lambda-packages-{run_id} by run id — could only redeploy a build
          # from the last 24h); raised to 7 on 2026-11-06 to match. Check it
          # with:
          #   gh api repos/:owner/:repo/actions/permissions/artifact-and-log-retention
          # If artifacts expire sooner than this value, that setting is why.
          retention-days: 7
          if-no-files-found: error
