name: Deploy Pipeline

# Triggered automatically after CI passes on main (deploys dev), then promotes
# through staging → prod via GitHub Environment protection rules (required reviewers).
# Each environment runs sequentially — staging only starts after dev smoke tests pass,
# prod only starts after staging smoke tests pass + a required-reviewer approval.
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (for hotfix re-deploys only)"
        required: true
        type: choice
        options: [dev, staging, prod]

# ---------------------------------------------------------------------------
# Reusable job templates via strategy — one concrete job per environment so
# GitHub's environment protection rules (required reviewers, wait timers) fire
# naturally between them.
# ---------------------------------------------------------------------------

jobs:
  # ── Dev — auto-deploys on every successful CI run ──────────────────────
  deploy-dev:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: dev
    secrets: inherit

  smoke-dev:
    needs: deploy-dev
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    permissions:
      contents: read
    uses: ./.github/workflows/_smoke-test.yml
    with:
      environment: dev
    secrets: inherit

  # ── Staging — gated by dev smoke tests + GitHub Environment approval ───
  deploy-staging:
    needs: smoke-dev
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: staging
    secrets: inherit

  smoke-staging:
    needs: deploy-staging
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/_smoke-test.yml
    with:
      environment: staging
    secrets: inherit

  # ── Prod — gated by staging smoke tests + GitHub Environment approval ──
  deploy-prod:
    needs: smoke-staging
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: prod
    secrets: inherit
