name: Terraform (Azure)

# Azure infra validation (on PRs) and read-only PLAN preview (on main pushes) —
# it does NOT apply. Apply is owned exclusively by _deploy-azure-env.yml so
# there is a single Terraform state-owner and zero lock contention. Plans use
# -lock=false so a preview never blocks or is blocked by a deploy apply.

on:
  pull_request:
    branches: [main]
    paths:
      - "infrastructure/azure/**"
      - "infrastructure/common/**"
      - ".github/workflows/terraform-azure.yml"
      - ".github/actions/terraform-run/**"
  push:
    branches: [main]
    paths:
      - "infrastructure/azure/**"
      - "infrastructure/common/**"
      - ".github/workflows/terraform-azure.yml"
      - ".github/actions/terraform-run/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to plan (dev/staging/prod run sequentially from the selected one; demo is standalone). Preview only — apply happens in deploy-azure.yml."
        required: true
        type: choice
        options: [dev, staging, prod, demo]
        default: dev

permissions:
  contents: read

jobs:
  # ── Credential-free fmt + validate on PRs and pushes to main ─────────────
  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7.5"
      - name: Terraform Format Check
        working-directory: infrastructure/azure
        run: terraform fmt -check -recursive
      - name: Terraform Validate
        working-directory: infrastructure/azure
        run: |
          terraform init -backend=false
          terraform validate

  # ── Dev — plan preview on every Azure infra push to main ─────────────────
  terraform-dev:
    needs: validate
    if: >-
      always() && vars.DEPLOY_CLOUD == 'azure' && (
        (github.event_name == 'push' && needs.validate.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
      )
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: terraform-azure-dev
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: ./.github/actions/terraform-run
        with:
          working-directory: infrastructure/azure
          environment: dev
          mode: plan

  # ── Staging — gated on AZURE_STAGING_READY for push/dev-chain; explicit dispatch always runs
  terraform-staging:
    needs: terraform-dev
    if: >-
      always() && vars.DEPLOY_CLOUD == 'azure' && (
        ((github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')) &&
          needs.terraform-dev.result == 'success' && vars.AZURE_STAGING_READY == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
      )
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: terraform-azure-staging
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: ./.github/actions/terraform-run
        with:
          working-directory: infrastructure/azure
          environment: staging
          mode: plan

  # ── Prod — gated on AZURE_PROD_READY for push/chain; explicit dispatch always runs
  terraform-prod:
    needs: terraform-staging
    if: >-
      always() && vars.DEPLOY_CLOUD == 'azure' && (
        ((github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && (inputs.environment == 'dev' || inputs.environment == 'staging'))) &&
          needs.terraform-staging.result == 'success' && vars.AZURE_PROD_READY == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')
      )
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: terraform-azure-prod
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: ./.github/actions/terraform-run
        with:
          working-directory: infrastructure/azure
          environment: prod
          mode: plan

  # ── Demo — standalone, dispatch-only (NOT in the dev->staging->prod chain)
  terraform-demo:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'demo' && vars.DEPLOY_CLOUD == 'azure'
    runs-on: ubuntu-latest
    environment: demo
    concurrency:
      group: terraform-azure-demo
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: ./.github/actions/terraform-run
        with:
          working-directory: infrastructure/azure
          environment: demo
          mode: plan
