name: Terraform (Azure)

# Azure infra PLAN/preview (fmt + validate + plan) on changes to main — a review
# check, it does NOT apply. The apply is owned by the deploy pipeline
# (_deploy-azure-env.yml runs `terraform apply` as its first step), so there is a
# single state-owner and no lock contention between workflows. Plans run with
# -lock=false so a preview never blocks or is blocked by a concurrent deploy
# apply. dev -> staging -> prod, each gated by its GitHub Environment. Auth is
# OIDC federated credentials. One-time setup + state bootstrap in
# infrastructure/azure/README.md.

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/azure/**"
      - "infrastructure/common/**"
      # The workflow file itself, so a change to this file is exercised by the
      # workflow it changes. frontend-ci.yml already does this; these two did
      # not, and it cost a real verification: #133 fixed this workflow's
      # permanently-failing staging job, touched nothing else, and therefore
      # never ran — leaving the fix unverified until some unrelated infra change
      # happened along. A CI fix you cannot trigger is a CI fix you have not
      # tested.
      - ".github/workflows/terraform-azure.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to plan (dev/staging/prod run sequentially from the selected one; demo is standalone). Preview only — apply happens in the deploy pipeline."
        required: true
        type: choice
        options: [dev, staging, prod, demo]

# Serialize infra plans per ref.
concurrency:
  group: terraform-azure-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Terraform azurerm provider + backend use OIDC; GitHub supplies the id-token.
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  # ── Dev — plan preview on every Azure infra change ───────────────────────
  terraform-dev:
    if: >-
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')) &&
      vars.DEPLOY_CLOUD == 'azure'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7.5"
      - name: Terraform Init
        working-directory: infrastructure/azure
        run: terraform init -backend-config=environments/dev.backend.hcl
      - name: Terraform Format Check
        working-directory: infrastructure/azure
        run: terraform fmt -check -recursive
      - name: Terraform Validate
        working-directory: infrastructure/azure
        run: terraform validate
      - name: Terraform Plan
        working-directory: infrastructure/azure
        run: terraform plan -var-file=environments/dev.tfvars -lock=false

  # ── Staging — gated by dev success + GitHub Environment approval ─────────
  #
  # Also gated on vars.AZURE_STAGING_READY. Until staging actually exists, its
  # GitHub Environment holds no AZURE_* secrets, so `azure/login` fails with
  # "Not all values are present" and this job went red on EVERY push touching
  # infrastructure/azure — 12 consecutive runs from 2026-10-14 to 2026-11-09.
  #
  # That mattered more than it looks. terraform-dev succeeded in all 12, so the
  # dev plan review was working the whole time — but the run-level conclusion
  # was "failure", which is the only thing anyone (me included) actually reads.
  # A check that is permanently red carries no information: it cannot tell you
  # that something broke, because it is already broken. The fix is to make the
  # red mean something again, not to look at it harder.
  #
  # Set the repo variable AZURE_STAGING_READY=true once the staging Environment
  # has AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID. A repo
  # variable, not a secret check: job-level `if` cannot see Environment secrets,
  # because the environment is not resolved until the job starts.
  terraform-staging:
    needs: terraform-dev
    if: >-
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && (inputs.environment == 'dev' || inputs.environment == 'staging'))) &&
      vars.DEPLOY_CLOUD == 'azure' && vars.AZURE_STAGING_READY == 'true'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7.5"
      - name: Terraform Init
        working-directory: infrastructure/azure
        run: terraform init -backend-config=environments/staging.backend.hcl
      - name: Terraform Format Check
        working-directory: infrastructure/azure
        run: terraform fmt -check -recursive
      - name: Terraform Validate
        working-directory: infrastructure/azure
        run: terraform validate
      - name: Terraform Plan
        working-directory: infrastructure/azure
        run: terraform plan -var-file=environments/staging.tfvars -lock=false

  # ── Prod — gated by staging success + GitHub Environment approval ─────────
  #
  # Same opt-in as staging (AZURE_PROD_READY). `needs: terraform-staging` alone
  # would already skip this while staging is skipped, but the flag is stated
  # explicitly so that enabling staging does not silently enable prod too.
  terraform-prod:
    needs: terraform-staging
    if: vars.DEPLOY_CLOUD == 'azure' && vars.AZURE_PROD_READY == 'true'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7.5"
      - name: Terraform Init
        working-directory: infrastructure/azure
        run: terraform init -backend-config=environments/prod.backend.hcl
      - name: Terraform Format Check
        working-directory: infrastructure/azure
        run: terraform fmt -check -recursive
      - name: Terraform Validate
        working-directory: infrastructure/azure
        run: terraform validate
      - name: Terraform Plan
        working-directory: infrastructure/azure
        run: terraform plan -var-file=environments/prod.tfvars -lock=false

  # ── Demo — standalone, dispatch-only (NOT in the dev→staging→prod chain) ──
  terraform-demo:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'demo' && vars.DEPLOY_CLOUD == 'azure'
    runs-on: ubuntu-latest
    environment: demo
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7.5"
      - name: Terraform Init
        working-directory: infrastructure/azure
        run: terraform init -backend-config=environments/demo.backend.hcl
      - name: Terraform Format Check
        working-directory: infrastructure/azure
        run: terraform fmt -check -recursive
      - name: Terraform Validate
        working-directory: infrastructure/azure
        run: terraform validate
      - name: Terraform Plan
        working-directory: infrastructure/azure
        run: terraform plan -var-file=environments/demo.tfvars -lock=false
