name: Deploy Azure Environment (reusable)

# Azure analogue of _deploy-env.yml. Every deploy runs `terraform apply` FIRST
# so infra + state are reconciled before any app rollout (this workflow is the
# single Terraform state-owner; terraform-azure.yml is plan-only). Then: build
# & push cached Docker image via Buildx -> run migration job -> roll all
# Container Apps & Jobs in parallel -> run shared read-only smoke suite.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      commit_sha:
        description: "Verified git ref or commit SHA to check out and deploy"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # Serialize per target environment — prevents Terraform state-lock races
    # across tags while allowing a prod hotfix to run alongside a dev deploy.
    concurrency:
      group: deploy-azure-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_entra_graph_client_secret: ${{ secrets.ENTRA_GRAPH_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Resolve canonical commit SHA
        id: meta
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Deploying verified commit: ${SHA}"

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7.5"

      # Terraform FIRST — reconcile infra + state before any app change.
      - name: Terraform apply (infra + state)
        id: tf
        working-directory: infrastructure/azure
        run: |
          set -euo pipefail
          terraform init -backend-config="environments/${{ inputs.environment }}.backend.hcl"
          terraform apply -var-file="environments/${{ inputs.environment }}.tfvars" -auto-approve
          terraform output -json > /tmp/tfout.json
          python3 - <<'PY'
          import json, os
          out = json.load(open("/tmp/tfout.json"))
          vals = {
              "rg": out["resource_group"]["value"],
              "acr": out["acr_name"]["value"],
              "acr_server": out["acr_login_server"]["value"],
              "migrate_job": out["migrate_job_name"]["value"],
              "api_url": out["api_url"]["value"],
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for k, v in vals.items():
                  f.write(f"{k}={v}\n")
          print("Infra applied — api_url=" + vals["api_url"])
          PY

      # Build + push with Docker Buildx + GitHub Actions layer cache so unchanged
      # uv/Python dependency layers build in ~15-20s instead of ~2-3 minutes.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ACR
        env:
          ACR: ${{ steps.tf.outputs.acr }}
        run: az acr login -n "$ACR"

      - name: Build and push image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tf.outputs.acr_server }}/shipx-backend:${{ steps.meta.outputs.sha }}
            ${{ steps.tf.outputs.acr_server }}/shipx-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Export image reference
        env:
          ACR_SERVER: ${{ steps.tf.outputs.acr_server }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: echo "IMAGE=${ACR_SERVER}/shipx-backend:${SHA}" >> "$GITHUB_ENV"

      # Migrations first — point the migrate Job at the new image, start it, wait.
      # alembic upgrade head is idempotent; a non-success aborts the deploy.
      - name: Run database migrations
        env:
          RG: ${{ steps.tf.outputs.rg }}
          MIGRATE_JOB: ${{ steps.tf.outputs.migrate_job }}
        run: |
          set -euo pipefail
          az containerapp job update -g "$RG" -n "$MIGRATE_JOB" --image "$IMAGE" --output none
          EXEC=$(az containerapp job start -g "$RG" -n "$MIGRATE_JOB" --query name -o tsv)
          echo "Started migration execution: $EXEC"

          STATUS=""
          for _ in $(seq 1 40); do
            STATUS=$(az containerapp job execution list -g "$RG" --name "$MIGRATE_JOB" \
              --query "[?name=='$EXEC'].properties.status | [0]" -o tsv)
            echo "migration status: ${STATUS:-<pending>}"
            case "$STATUS" in
              Succeeded|Failed|Degraded) break ;;
            esac
            sleep 15
          done

          if [ "$STATUS" != "Succeeded" ]; then
            echo "::error::Migration did not succeed (status: ${STATUS:-unknown}). Recent logs:"
            az containerapp job logs show -g "$RG" --name "$MIGRATE_JOB" \
              --execution "$EXEC" --container migrate --tail 200 2>/dev/null \
              || echo "(could not fetch logs via CLI — check Log Analytics / portal execution history)"
            exit 1
          fi
          echo "Migration succeeded."

          # Surface app-role credential status on success (best-effort).
          echo "--- migrate job: credential status ---"
          az containerapp job logs show -g "$RG" --name "$MIGRATE_JOB" \
            --execution "$EXEC" --container migrate --tail 200 2>/dev/null \
            | grep -i "app role credential" \
            || echo "(credential line not retrieved — check the job execution logs directly)"

      # Roll all Container Apps (api + workers + entra-claims) and non-migrate
      # Jobs onto the new image in parallel (migrate job was already updated above).
      - name: Update apps and jobs to the new image (parallel)
        env:
          RG: ${{ steps.tf.outputs.rg }}
          MIGRATE_JOB: ${{ steps.tf.outputs.migrate_job }}
        run: |
          set -euo pipefail
          MAX_PARALLEL=5
          pids=()
          failed=0

          wait_batch() {
            for pid in "${pids[@]}"; do
              if ! wait "$pid"; then
                failed=1
              fi
            done
            pids=()
            if [ "$failed" -ne 0 ]; then
              echo "::error::One or more Container App / Job updates failed"
              exit 1
            fi
          }

          for app in $(az containerapp list -g "$RG" --query "[].name" -o tsv); do
            (
              echo "-> Updating app $app"
              az containerapp update -g "$RG" -n "$app" --image "$IMAGE" --output none
              echo "ok: Updated app $app"
            ) &
            pids+=($!)
            if [ "${#pids[@]}" -ge "$MAX_PARALLEL" ]; then
              wait_batch
            fi
          done

          for job in $(az containerapp job list -g "$RG" --query "[].name" -o tsv); do
            if [ "$job" = "$MIGRATE_JOB" ]; then
              echo "Skipping $job (already updated before migrations)"
              continue
            fi
            (
              echo "-> Updating job $job"
              az containerapp job update -g "$RG" -n "$job" --image "$IMAGE" --output none
              echo "ok: Updated job $job"
            ) &
            pids+=($!)
            if [ "${#pids[@]}" -ge "$MAX_PARALLEL" ]; then
              wait_batch
            fi
          done
          wait_batch

      # Shared read-only smoke suite: health 200, unauthenticated 401, DB
      # reachability (404 on /v1/invites/<bogus>), and 2s response-time SLA.
      - name: Smoke test
        uses: ./.github/actions/smoke-test
        with:
          api-base-url: ${{ steps.tf.outputs.api_url }}
          health-path: /health
          warmup-seconds: "15"
          sla-seconds: "2.0"

      - name: Deployment summary
        env:
          API_URL: ${{ steps.tf.outputs.api_url }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          echo "Azure deploy complete (${{ inputs.environment }})"
          echo "  Commit: $SHA"
          echo "  API:    $API_URL"
