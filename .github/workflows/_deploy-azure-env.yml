name: Deploy Azure Environment (reusable)

# Azure analogue of _deploy-env.yml. Every deploy runs `terraform apply` FIRST,
# in the same job, so infra + state are reconciled and any change captured before
# the app rolls — and if the apply fails, no later step runs (they all depend on
# its outputs). This workflow is the single Terraform state-owner for an
# environment; terraform-azure.yml is plan-only (infra review), it does not apply.
#
# After the apply: build the image, push to the env's ACR, run the migration job,
# roll every Container App + Job onto the new image, smoke-test the API. Infra
# names/URLs come from the apply's own outputs — one source of truth.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      # Terraform azurerm backend + provider auth via OIDC (no stored secret).
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Graph provisioning app secret (EntraIdentityProvider client-credentials).
      # A GitHub Environment secret, injected as a Terraform variable at apply —
      # never committed to tfvars. Empty when unset → managed-identity fallback.
      TF_VAR_entra_graph_client_secret: ${{ secrets.ENTRA_GRAPH_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      # Terraform FIRST — reconcile infra + state before any app change. If this
      # fails the job stops here; every later step depends on steps.tf.outputs,
      # so the deploy cannot proceed on un-applied/failed infra. apply is a no-op
      # when nothing changed, so it is safe to run on every deploy.
      - name: Terraform apply (infra + state)
        id: tf
        working-directory: infrastructure/azure
        run: |
          terraform init -backend-config=environments/${{ inputs.environment }}.backend.hcl
          terraform apply -var-file=environments/${{ inputs.environment }}.tfvars -auto-approve
          terraform output -json > /tmp/tfout.json
          python3 - <<'PY'
          import json, os
          out = json.load(open("/tmp/tfout.json"))
          vals = {
              "rg": out["resource_group"]["value"],
              "acr": out["acr_name"]["value"],
              "acr_server": out["acr_login_server"]["value"],
              "migrate_job": out["migrate_job_name"]["value"],
              "api_url": out["api_url"]["value"],
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for k, v in vals.items():
                  f.write(f"{k}={v}\n")
          print("Infra applied — api_url=" + vals["api_url"])
          PY

      # Build + push the same image the Dockerfile produces, tagged with the SHA.
      - name: Build and push image
        env:
          ACR: ${{ steps.tf.outputs.acr }}
          ACR_SERVER: ${{ steps.tf.outputs.acr_server }}
        run: |
          az acr login -n "$ACR"
          IMAGE="${ACR_SERVER}/shipx-backend:${{ github.sha }}"
          docker build -t "$IMAGE" -t "${ACR_SERVER}/shipx-backend:latest" .
          docker push "$IMAGE"
          docker push "${ACR_SERVER}/shipx-backend:latest"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Migrations first — point the migrate Job at the new image, start it, wait.
      # alembic upgrade head is idempotent; a non-success aborts the deploy.
      - name: Run database migrations
        env:
          RG: ${{ steps.tf.outputs.rg }}
          MIGRATE_JOB: ${{ steps.tf.outputs.migrate_job }}
        run: |
          az containerapp job update -g "$RG" -n "$MIGRATE_JOB" --image "$IMAGE" --output none
          EXEC=$(az containerapp job start -g "$RG" -n "$MIGRATE_JOB" --query name -o tsv)
          echo "Started migration execution: $EXEC"

          # Poll via `execution list` + JMESPath (reliable across CLI versions,
          # unlike `execution show`). Status is read into STATUS; a read error
          # leaves it empty and we keep waiting, but failures are NOT masked.
          STATUS=""
          for _ in $(seq 1 40); do
            STATUS=$(az containerapp job execution list -g "$RG" --name "$MIGRATE_JOB" \
              --query "[?name=='$EXEC'].properties.status | [0]" -o tsv)
            echo "migration status: ${STATUS:-<pending>}"
            case "$STATUS" in
              Succeeded) break ;;
              Failed|Degraded) break ;;
            esac
            sleep 15
          done

          if [ "$STATUS" != "Succeeded" ]; then
            echo "::error::Migration did not succeed (status: ${STATUS:-unknown}). Recent logs:"
            az containerapp job logs show -g "$RG" --name "$MIGRATE_JOB" \
              --execution "$EXEC" --container migrate --tail 200 2>/dev/null \
              || echo "(could not fetch logs via CLI — check Log Analytics / the portal execution history)"
            exit 1
          fi
          echo "Migration succeeded."

      # Roll every Container App (api + workers) and Job (scheduled + migrate)
      # onto the new image. Terraform ignores image drift, so this does not fight it.
      - name: Update apps and jobs to the new image
        env:
          RG: ${{ steps.tf.outputs.rg }}
        run: |
          for app in $(az containerapp list -g "$RG" --query "[].name" -o tsv); do
            echo "Updating app $app"
            az containerapp update -g "$RG" -n "$app" --image "$IMAGE" --output none
          done
          for job in $(az containerapp job list -g "$RG" --query "[].name" -o tsv); do
            echo "Updating job $job"
            az containerapp job update -g "$RG" -n "$job" --image "$IMAGE" --output none
          done
          # The Entra claims provider (shipx-*-entra-claims) is a Container App on
          # the same image, so the loop above already rolled it — no separate step.

      # Read-only smoke against the live ingress: health 200, unauthenticated 401,
      # response-time SLA. Safe for prod.
      - name: Smoke test
        env:
          API_BASE: ${{ steps.tf.outputs.api_url }}
        run: |
          echo "Smoke-testing $API_BASE"
          sleep 15  # allow the new revision to become ready

          code=$(curl -sf --max-time 15 --retry 5 --retry-delay 5 -o /dev/null -w "%{http_code}" "$API_BASE/health")
          echo "health: $code"; test "$code" = "200"

          failed=0
          for ep in "/v1/packing-lists" "/v1/billing/disputes" "/v1/manifests" "/v1/containers" "/v1/claims"; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$API_BASE$ep")
            if [ "$status" != "401" ]; then echo "FAIL: $ep → $status (want 401)"; failed=1; else echo "OK: $ep → 401"; fi
          done
          exit $failed

      - name: Deployment summary
        env:
          API_URL: ${{ steps.tf.outputs.api_url }}
        run: |
          echo "✅ Azure deploy complete (${{ inputs.environment }})"
          echo "   Commit: ${{ github.sha }}"
          echo "   API:    $API_URL"
