name: Deploy Environment (reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      artifact_run_id:
        description: "Run ID of the CI Pipeline that produced the lambda-packages artifact"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      actions: read    # required to download artifacts from a different workflow run

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      # Download the pre-built artifact from the CI run — the same binary
      # that passed lint/test/security. No pip install, no rebuild.
      - name: Download lambda packages
        uses: actions/download-artifact@v4
        with:
          name: lambda-packages-${{ inputs.artifact_run_id }}
          path: build/
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ── Database migrations ────────────────────────────────────────────────
      # Run before any service code deploys. Aborts the entire deploy on failure.
      # alembic upgrade head is idempotent — safe to re-run when already at HEAD.
      - name: Run database migrations
        env:
          ENV: ${{ inputs.environment }}
        run: |
          aws lambda update-function-code \
            --function-name logistics-migrate-${ENV} \
            --zip-file fileb://build/migrate.zip \
            --architectures arm64 \
            --no-cli-pager
          aws lambda wait function-updated --function-name logistics-migrate-${ENV}

          RESULT=$(aws lambda invoke \
            --function-name logistics-migrate-${ENV} \
            --payload '{}' \
            --log-type Tail \
            --cli-binary-format raw-in-base64-out \
            /tmp/migrate-out.json)
          echo "$RESULT" | jq -r '.LogResult' | base64 -d
          STATUS=$(jq -r '.status // "error"' /tmp/migrate-out.json)
          [ "$STATUS" = "ok" ] || { echo "Migration FAILED — aborting deploy"; exit 1; }

      # ── Shared Lambda layer ────────────────────────────────────────────────
      # publish-layer-version creates a NEW ARN with an incremented version
      # suffix (e.g. :42). Capture it so all functions are updated to use the
      # new version — update-function-code alone does NOT update the layer.
      - name: Deploy shared layer
        id: layer
        run: |
          LAYER_ARN=$(aws lambda publish-layer-version \
            --layer-name logistics-shared-${{ inputs.environment }} \
            --zip-file fileb://build/shared-layer.zip \
            --compatible-runtimes python3.12 \
            --compatible-architectures arm64 \
            --query 'LayerVersionArn' \
            --output text)
          echo "arn=${LAYER_ARN}" >> "$GITHUB_OUTPUT"

      # ── API + utility service Lambdas ─────────────────────────────────────
      # Two waits per function: update-function-code and update-function-configuration
      # each independently enter Updating state. Calling config-update while code-update
      # is still in-flight returns ResourceConflictException.
      # Format: "fn-suffix:zip-name" — fn-suffix matches Terraform name field (hyphens).
      - name: Deploy services
        env:
          LAYER_ARN: ${{ steps.layer.outputs.arn }}
          ENV: ${{ inputs.environment }}
        run: |
          deploy_fn() {
            local fn="$1" zip="$2"
            aws lambda update-function-code \
              --function-name "$fn" \
              --zip-file "fileb://build/${zip}.zip" \
              --architectures arm64 \
              --no-cli-pager
            aws lambda wait function-updated --function-name "$fn"
            aws lambda update-function-configuration \
              --function-name "$fn" \
              --layers "$LAYER_ARN" \
              --no-cli-pager
            aws lambda wait function-updated --function-name "$fn"
          }

          # "fn-suffix:zip-stem" pairs — suffix matches Terraform name field
          for entry in \
            "tenant-mgmt:tenant_management" \
            "packing-list:packing_list" \
            "manifest:manifest" \
            "tracking:tracking" \
            "billing:billing" \
            "claims:claims" \
            "payment-release:payment_release" \
            "refunds:refunds" \
            "excel:excel" \
            "metering:metering"; do
            fn_suffix="${entry%%:*}"
            zip_name="${entry##*:}"
            deploy_fn "logistics-${fn_suffix}-${ENV}" "${zip_name}"
          done

          # Notification: 3 separate functions, all deployed from notification.zip
          for notif in notif-sms notif-whatsapp notif-email; do
            deploy_fn "logistics-${notif}-${ENV}" "notification"
          done

      # ── Scheduled job Lambdas ─────────────────────────────────────────────
      # Format: "fn-suffix:job-key" — fn-suffix matches Terraform name field,
      # job-key is the underscore key used in the zip filename (scheduled-{key}.zip).
      - name: Deploy scheduled jobs
        env:
          LAYER_ARN: ${{ steps.layer.outputs.arn }}
          ENV: ${{ inputs.environment }}
        run: |
          deploy_fn() {
            local fn="$1" zip="$2"
            aws lambda update-function-code \
              --function-name "$fn" \
              --zip-file "fileb://build/${zip}.zip" \
              --architectures arm64 \
              --no-cli-pager
            aws lambda wait function-updated --function-name "$fn"
            aws lambda update-function-configuration \
              --function-name "$fn" \
              --layers "$LAYER_ARN" \
              --no-cli-pager
            aws lambda wait function-updated --function-name "$fn"
          }

          for entry in \
            "storage-fee:storage_fee" \
            "dispute-escalation:dispute_escalation" \
            "sla-check:sla_check" \
            "storage-reminders:storage_reminders" \
            "data-cleanup:data_cleanup" \
            "usage-aggregation:usage_aggregation" \
            "release-expiry:release_expiry"; do
            fn_suffix="${entry%%:*}"
            job_key="${entry##*:}"
            deploy_fn "logistics-${fn_suffix}-${ENV}" "scheduled-${job_key}"
          done
