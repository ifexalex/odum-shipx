name: Deploy Environment (reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      artifact_run_id:
        description: "Run ID of the CI Pipeline that produced the lambda-packages artifact"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # Serialize per target environment — never cancel a deploy mid-run, and
    # never let a dev deploy block a prod hotfix.
    concurrency:
      group: deploy-aws-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      actions: read    # required to download artifacts from a different workflow run

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      # Download the pre-built artifact from the CI run — the same binary
      # that passed lint/test/security. No pip install, no rebuild.
      - name: Download lambda packages
        uses: actions/download-artifact@v8
        with:
          name: lambda-packages-${{ inputs.artifact_run_id }}
          path: build/
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ── Shared Lambda layer (published FIRST — immutable version ARN) ─────
      # Publishing creates a new layer version without touching any live service
      # Lambda yet. Attaching it to the migrate Lambda next guarantees migrations
      # always run against the matching commit's shared/ module and uv.lock deps.
      - name: Deploy shared layer
        id: layer
        run: |
          set -euo pipefail
          LAYER_ARN=$(aws lambda publish-layer-version \
            --layer-name "logistics-shared-${{ inputs.environment }}" \
            --zip-file fileb://build/shared-layer.zip \
            --compatible-runtimes python3.13 \
            --compatible-architectures arm64 \
            --query 'LayerVersionArn' \
            --output text)
          echo "Published layer: $LAYER_ARN"
          echo "arn=${LAYER_ARN}" >> "$GITHUB_OUTPUT"

      # ── Database migrations ────────────────────────────────────────────────
      # Run before any service Lambda is updated. Aborts the deploy on failure.
      # alembic upgrade head is idempotent — safe to re-run when already at HEAD.
      - name: Run database migrations
        env:
          ENV: ${{ inputs.environment }}
          LAYER_ARN: ${{ steps.layer.outputs.arn }}
        run: |
          set -euo pipefail
          FN="logistics-migrate-${ENV}"
          aws lambda update-function-code \
            --function-name "$FN" \
            --zip-file fileb://build/migrate.zip \
            --architectures arm64 \
            --no-cli-pager >/dev/null
          aws lambda wait function-updated --function-name "$FN"

          aws lambda update-function-configuration \
            --function-name "$FN" \
            --layers "$LAYER_ARN" \
            --no-cli-pager >/dev/null
          aws lambda wait function-updated --function-name "$FN"

          RESULT=$(aws lambda invoke \
            --function-name "$FN" \
            --payload '{}' \
            --log-type Tail \
            --cli-binary-format raw-in-base64-out \
            /tmp/migrate-out.json)
          echo "$RESULT" | jq -r '.LogResult' | base64 -d
          STATUS=$(jq -r '.status // "error"' /tmp/migrate-out.json)
          [ "$STATUS" = "ok" ] || { echo "Migration FAILED — aborting deploy"; exit 1; }

      # ── All 25 application, notification, auth, and scheduled Lambdas ──────
      # Every function ships the single shared build/services.zip + $LAYER_ARN.
      # Code-update -> wait -> config-update -> wait stays strictly sequential
      # per function (avoiding ResourceConflictException), while up to 6 distinct
      # functions roll in parallel (~5x faster than serial deployment).
      # Guarded by tests/unit/test_infrastructure_contracts.py::TestLambdaPackageLayout.
      - name: Deploy Lambda functions (parallel)
        env:
          LAYER_ARN: ${{ steps.layer.outputs.arn }}
          ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          deploy_fn() {
            local fn="$1"
            echo "-> Updating $fn"
            aws lambda update-function-code \
              --function-name "$fn" \
              --zip-file fileb://build/services.zip \
              --architectures arm64 \
              --no-cli-pager >/dev/null
            aws lambda wait function-updated --function-name "$fn"
            aws lambda update-function-configuration \
              --function-name "$fn" \
              --layers "$LAYER_ARN" \
              --no-cli-pager >/dev/null
            aws lambda wait function-updated --function-name "$fn"
            echo "ok: Updated $fn"
          }

          # Complete list of Terraform Lambda name suffixes (infrastructure/aws/modules/lambda/main.tf)
          FUNCTIONS=(
            # VPC API Lambdas (12)
            tenant-mgmt
            packing-list
            manifest
            tracking
            billing
            claims
            payment-release
            refunds
            excel
            search
            notif-api
            notif-webhook
            # VPC SQS + HTTP dual-mode Lambda (1)
            metering
            # Non-VPC notification SQS consumers (3)
            notif-sms
            notif-whatsapp
            notif-email
            # Non-VPC auth session Lambda (1)
            auth
            # VPC EventBridge scheduled Lambdas (9)
            storage-fee
            dispute-escalation
            sla-check
            storage-reminders
            data-cleanup
            usage-aggregation
            release-expiry
            offboarding-export
            platform-approvals
          )

          MAX_PARALLEL=6
          pids=()
          failed=0

          wait_batch() {
            for pid in "${pids[@]}"; do
              if ! wait "$pid"; then
                failed=1
              fi
            done
            pids=()
            if [ "$failed" -ne 0 ]; then
              echo "::error::One or more Lambda deployments failed"
              exit 1
            fi
          }

          for suffix in "${FUNCTIONS[@]}"; do
            deploy_fn "logistics-${suffix}-${ENV}" &
            pids+=($!)
            if [ "${#pids[@]}" -ge "$MAX_PARALLEL" ]; then
              wait_batch
            fi
          done
          wait_batch
